[project]
name = "songaday-data"
version = "0.1.0"
description = "Every Song A Day song as data: the cleaned spreadsheet plus weather, moon, planets, news and views, and the patterns in it."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "requests>=2.31",
  "ephem>=4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
